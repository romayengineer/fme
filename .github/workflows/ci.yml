name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in sync with the `toolchain` directive in go.work and go.mod.
  # PocketBase v0.21.3 crashes under Go 1.27's encoding/json; see fme-1ke.1.
  GO_VERSION: "1.25.14"
  GOTOOLCHAIN: "go1.25.14"
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  # One source of truth for the module list: go.work, via scripts/modules.sh.
  modules:
    name: modules
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum
      - name: List workspace modules
        id: list
        run: |
          echo "list=$(./scripts/modules.sh | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  lint:
    name: lint (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum
      - uses: golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: ./...

  format:
    name: format
    needs: modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum
      - uses: golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: Check formatting
        run: |
          for m in $(./scripts/modules.sh); do
            echo "== $m"
            (cd "$m" && golangci-lint fmt --diff ./...)
          done

  vuln:
    name: govulncheck
    needs: modules
    runs-on: ubuntu-latest
    # Non-blocking until PocketBase is upgraded (fme-1ke.6): v0.21.3 currently
    # reports known vulnerabilities. Make this blocking after that migration.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum
      - name: Scan the binary's dependency graph
        working-directory: go/cmd/fme
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum
      - name: shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          "$(go env GOPATH)/bin/shfmt" -d -i 4 -ci scripts

  test:
    name: test (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum
      - name: Vet, test, and measure coverage
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ replace(matrix.module, '/', '-') }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore
